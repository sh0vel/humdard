name = "humdard-lyric-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lyric-lessons"

# Cloudflare Queue — async song generation
[[queues.producers]]
queue = "lyric-generation"
binding = "GENERATION_QUEUE"

[[queues.consumers]]
queue = "lyric-generation"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

# Environment Variables
[vars]
ALLOWED_ORIGINS = "*"
OPENAI_MODEL = "gpt-4o"
SPOTIFY_CLIENT_ID = "55c2275c63634074aa13b4d40e359e6f"

# Secrets (set via wrangler secret put)
# - OPENAI_API_KEY: Your OpenAI API key
# - SPOTIFY_CLIENT_SECRET: Your Spotify app client secret
# - YOUTUBE_API_KEY: YouTube Data API v3 key (enables description-based lyric lookup)

# Local dev
[env.development]
vars = { ALLOWED_ORIGINS = "*", OPENAI_MODEL = "gpt-4o" }

# Preview — deploy feature branches here before merging to main
# Usage: npx wrangler deploy --env preview
# URL:   humdard-lyric-api-preview.<account>.workers.dev
# Secrets must be set once: npx wrangler secret put OPENAI_API_KEY --env preview
[env.preview]
name = "humdard-lyric-api-preview"
vars = { ALLOWED_ORIGINS = "*", OPENAI_MODEL = "gpt-4o", SPOTIFY_CLIENT_ID = "55c2275c63634074aa13b4d40e359e6f" }

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "lyric-lessons"

[[env.preview.queues.producers]]
queue = "lyric-generation"
binding = "GENERATION_QUEUE"

[[env.preview.queues.consumers]]
queue = "lyric-generation"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

# Production — deploys to humdard-lyric-api.<account>.workers.dev
# Usage: npx wrangler deploy --env production
[env.production]
name = "humdard-lyric-api"
vars = { ALLOWED_ORIGINS = "*", OPENAI_MODEL = "gpt-4o", SPOTIFY_CLIENT_ID = "55c2275c63634074aa13b4d40e359e6f" }

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "lyric-lessons"

[[env.production.queues.producers]]
queue = "lyric-generation"
binding = "GENERATION_QUEUE"

[[env.production.queues.consumers]]
queue = "lyric-generation"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

name = "humdard-lyric-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lyric-lessons"

# Cloudflare Queue — async song generation
[[queues.producers]]
queue = "lyric-generation"
binding = "GENERATION_QUEUE"

[[queues.consumers]]
queue = "lyric-generation"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

# Environment Variables
[vars]
ALLOWED_ORIGINS = "*"
OPENAI_MODEL = "gpt-5.5"
SPOTIFY_CLIENT_ID = "55c2275c63634074aa13b4d40e359e6f"

# Secrets (set via wrangler secret put)
# - OPENAI_API_KEY: Your OpenAI API key
# - SPOTIFY_CLIENT_SECRET: Your Spotify app client secret
# - YOUTUBE_API_KEY: YouTube Data API v3 key (enables description-based lyric lookup)

# Development configuration
[env.development]
vars = { ALLOWED_ORIGINS = "*", OPENAI_MODEL = "gpt-5.5" }

# Production configuration
[env.production]
# Set specific allowed origins in production
# vars = { ALLOWED_ORIGINS = "https://yourdomain.com,https://app.yourdomain.com" }
